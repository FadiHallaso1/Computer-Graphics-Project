<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ripple Water</title>
  <meta name="description" content="Real-time procedural water: Gerstner waves, Fresnel shading and interactive wave-equation ripples in WebGL.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <header class="hud">
    <h1 class="hud-title">Ripple Water</h1>
    <p class="hud-hint hint-mouse"><b>Click</b> drop a stone · <b>Shift + drag</b> stir · <b>Drag</b> orbit · <b>Scroll</b> zoom</p>
    <p class="hud-hint hint-touch"><b>Tap</b> drop a stone · <b>Drag</b> orbit · <b>Pinch</b> zoom</p>
  </header>
  <script type="module" src="src/main.js"></script>
</body>
</html>
