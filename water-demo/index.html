<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ripple Water</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="hud" id="hud">
    <span class="hud-stage" id="hud-stage">Stage 5 · ripples</span>
    <span class="hud-stat" id="hud-stats"></span>
    <span class="hud-hint">Click: drop · Shift+drag: stir</span>
    <button type="button" id="btn-wire" aria-pressed="false">Wireframe <kbd>W</kbd></button>
    <button type="button" id="btn-normals" aria-pressed="false">Normals <kbd>N</kbd></button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
